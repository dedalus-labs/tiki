[package]
name = "tiki-compile"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
description = "Tiki's kernel compiler: kernel IR and the proofs that make a kernel safe to lower"
license = "Apache-2.0"

[dependencies]
thiserror = "2"
tiki-cute = { path = "../cute" }

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
expect_used = "warn"
panic = "warn"
unwrap_used = "warn"
