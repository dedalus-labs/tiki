[package]
name = "tiki-cute"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
description = "CuTe layout algebra with static and dynamic extents, checked tensors and swizzles"

[workspace]
members = ["python"]

[dependencies]
thiserror = "2"

[dev-dependencies]
proptest = "1"

[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
