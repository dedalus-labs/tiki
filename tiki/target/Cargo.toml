[package]
name = "tiki-target"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
description = "The parallel processors Tiki's kernel compiler targets: memory spaces and execution units"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
