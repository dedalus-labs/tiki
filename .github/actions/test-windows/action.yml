name: 'Run tests'
description: 'Run Python and C++ tests on Windows'

runs:
  using: 'composite'
  steps:
    - name: Run Python tests - CPU
      shell: bash
      env:
        DEVICE: cpu
      run: uv run python/tests/run.py -v

    - name: Run CPP tests - CPU
      shell: bash
      env:
        DEVICE: cpu
      run: ./build/cpp/tiki/tests.exe -tce="*gguf*"
