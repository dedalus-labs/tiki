exclude: ^(experiments/rust_backend/repros/crubit/generated/|python/mlx/tiki/_pycute/)
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-yaml
    # -   id: end-of-file-fixer
    # -   id: trailing-whitespace
-   repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v21.1.8
    hooks:
    -   id: clang-format
        files: \.(h|cpp)$
# Using this mirror lets us use mypyc-compiled black, which is about 2x faster
-   repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.1.0
    hooks:
    -   id: black
        exclude: ^experiments/cute_backend/(tiki_compiler/|typings/|tiki\.py$|associative_scan\.py$|check\.py$|test_.*\.py$|demo_.*\.py$)
    
-   repo: https://github.com/pycqa/isort
    rev: 7.0.0
    hooks:
    -   id: isort
        exclude: ^experiments/cute_backend/(tiki_compiler/|typings/|tiki\.py$|associative_scan\.py$|check\.py$|test_.*\.py$|demo_.*\.py$)
        args:
            - --profile=black
            - --src=experiments/cute_backend
            - --src=experiments/associative_scan
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
    -   id: ruff-check
        files: ^experiments/cute_backend/(tiki_compiler/|typings/|tiki\.py$|associative_scan\.py$|check\.py$|test_.*\.py$|demo_.*\.py$)
    -   id: ruff-format
        files: ^experiments/cute_backend/(tiki_compiler/|typings/|tiki\.py$|associative_scan\.py$|check\.py$|test_.*\.py$|demo_.*\.py$)
- repo: https://github.com/cheshirekow/cmake-format-precommit
  rev: v0.6.13
  hooks:
    - id: cmake-format
